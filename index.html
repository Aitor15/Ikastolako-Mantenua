<script>
const $=id=>document.getElementById(id);

const pad=n=>String(n).padStart(2,"0");
const now=new Date(),today=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const PR={alta:"Premiazkoa",media:"Arrunta",baja:"Ahal denean"},PO={alta:0,media:1,baja:2};
const ST={pend:"Egiteko",curso:"Egiten",hecho:"Eginda"};
let DL=null,staff=[],spaces=[],tasks=[],ALL=[],events=[],revs=[],docs=[],AS=null,dfilt="all",DB=null,view="rooms",room=null,filt="open";
const cl=x=>JSON.parse(JSON.stringify(x));

/* ---------- datos: base compartida de la app, o este navegador si no está disponible ---------- */
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const LSset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function put(col,o){
 if(!DB){LSset("mnt_"+col,(col==="spaces"?spaces:col==="events"?events:col==="revs"?revs:col==="docs"?docs:col==="staff"?staff:ALL));render();return}
 const{id,...d}=o;DB.collection(col).doc(id).set(d).catch(e=>toast("Ezin izan da gorde ("+(e&&e.code||"errorea")+"). Saiatu berriro."));render()}
function del(col,id){
 if(!DB){LSset("mnt_"+col,(col==="spaces"?spaces:col==="events"?events:col==="revs"?revs:col==="docs"?docs:col==="staff"?staff:ALL));render();return}
 DB.collection(col).doc(id).delete().catch(()=>toast("Ezin izan da ezabatu. Saiatu berriro."));render()}
function saveTask(t){const i=ALL.findIndex(x=>x.id===t.id);if(i>=0)ALL[i]=t;else ALL.push(t);put("tasks",t)}
function saveSpace(s){const i=spaces.findIndex(x=>x.id===s.id);if(i>=0)spaces[i]=s;else spaces.push(s);put("spaces",s)}
function nextOT(){return ALL.reduce((m,t)=>Math.max(m,+t.ot||0),0)+1}

/* ---------- helpers ---------- */
const sp=id=>spaces.find(s=>s.id===id);
const open=t=>t.status!=="hecho";
const late=t=>open(t)&&t.due&&t.due<today;
const fmtD=d=>{if(!d)return"";const x=new Date(d+"T00:00");return x.toLocaleDateString("eu-ES",{day:"numeric",month:"short"})};
const sortT=a=>a.sort((x,y)=>(open(y)-open(x))||(PO[x.prio]-PO[y.prio])||((x.due||"9")>(y.due||"9")?1:-1)||(x.ot-y.ot));
let OZ=LS("mnt_open",[]);
const ZO=["HH","LH","DBH","Irakasle gelak","Idazkaritza","Komunak","Besteak","Kanpoa"];
let ZU=LS("mnt_zord",null);
const byOrd=(a,b)=>((a.ord??1e9)-(b.ord??1e9))||a.name.localeCompare(b.name,"es",{numeric:true});
const zi=k=>{if(ZU){const j=ZU.indexOf(k);if(j>=0)return j;return ZU.length+(ZO.indexOf(k)<0?ZO.length:ZO.indexOf(k))}const i=ZO.indexOf(k);return i<0?ZO.length-1.5:i};
const zones=()=>{const z=["Komunak","Idazkaritza"];spaces.forEach(s=>{const k=s.zone||"Solairurik gabe";if(!z.includes(k))z.push(k)});return z.sort((a,b)=>zi(a)-zi(b)||a.localeCompare(b,"eu"))};
const wk=new Date(now);wk.setDate(wk.getDate()-7);const wkISO=wk.toISOString().slice(0,10);

/* ---------- pantalla ---------- */
const yr=d=>{if(!d)return CY;const y=+d.slice(0,4),m=+d.slice(5,7);const a=m>=9?y:y-1;return a+"-"+String((a+1)%100).padStart(2,"0")};
const CY=yr(today);let SY=LS("mnt_year",CY);
const inYear=t=>SY==="all"||(open(t)?yr(t.created)<=SY:yr(t.doneAt||t.created)===SY);
function yearSel(){const NY=(()=>{const a=+CY.slice(0,4)+1;return a+"-"+String((a+1)%100).padStart(2,"0")})();const ys=[...new Set([NY,CY,...ALL.map(t=>yr(t.created))])].sort().reverse();if(SY!=="all"&&!ys.includes(SY))SY=CY;
 $("sy").innerHTML=ys.map(y=>`<option value="${y}"${y===SY?" selected":""}>${y}</option>`).join("")+`<option value="all"${SY==="all"?" selected":""}>Ikasturte guztiak</option>`}
function avisos(){const A=$("avis");if(!A)return;const t=new Date(today+"T00:00");t.setDate(t.getDate()+1);const tm=iso(t);
 const L=events.filter(e=>e.type==="bilera"&&(e.date===today||e.date===tm)).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
 A.hidden=!L.length;A.innerHTML=L.map(e=>`<button class="av${e.date===today?"":" bihar"}" data-avd="${esc(e.date)}"><span class="avd">${e.date===today?"Gaur":"Bihar"}</span><span class="avt">${esc(e.title||"—")}</span>${e.time||e.place?`<span class="avh">${[esc(e.time||""),esc(e.place||"")].filter(Boolean).join(" · ")}</span>`:""}</button>`).join("");
 A.querySelectorAll("[data-avd]").forEach(b=>b.onclick=()=>{view="cal";CD=b.dataset.avd;CM=CD.slice(0,7);render();scrollTo(0,0)})}
function render(){if(document.body.classList.contains("dragging"))return;tasks=ALL.filter(inYear);yearSel();avisos();
 $("mode").textContent=DB?"Hodeian gordeta · berdin ikusten da zure gailu guztietan":"Nabigatzaile honetan bakarrik gordeta";
 const op=tasks.filter(open),urg=op.filter(t=>t.prio==="alta"||late(t)),dn=tasks.filter(t=>t.status==="hecho");
 $("kpis").innerHTML=`<div class="kpi"><b>${op.length}</b><span>Egiteko</span></div><div class="kpi urg"><b>${urg.length}</b><span>Premiazkoak</span></div><div class="kpi"><b>${dn.length}</b><span>Eginda</span></div>`;
 $("vRooms").textContent=`Mantenu lanak (${op.length})`;$("vRooms").classList.toggle("on",view==="rooms");$("vAll").classList.toggle("on",view==="rev");$("vCal").classList.toggle("on",view==="cal");$("vDoc").classList.toggle("on",view==="doc");$("vStaff").classList.toggle("on",view==="staff");$("jump").parentElement.hidden=view!=="rooms";
 const J=$("jump"),cur=view==="rooms"&&room&&sp(room)?room:"";
 J.innerHTML=`<option value="">${spaces.length?"Aukeratu gela bat…":"Oraindik ez dago gelarik"}</option>`+zones().filter(z=>spaces.some(s=>(s.zone||"Solairurik gabe")===z)).map(z=>`<optgroup label="${esc(z)} · ${tasks.filter(t=>open(t)&&spaces.some(s=>s.id===t.space&&(s.zone||"Solairurik gabe")===z)).length} egiteko">${spaces.filter(s=>(s.zone||"Solairurik gabe")===z).sort(byOrd).map(s=>{const n=tasks.filter(t=>t.space===s.id&&open(t)).length;return `<option value="${esc(s.id)}"${s.id===cur?" selected":""}>${esc(s.name)}${n?" · "+n+" egiteko":""}</option>`}).join("")}</optgroup>`).join("");
 const V=$("view");
 if(view==="rooms"&&room&&sp(room))return drawRoom(V,sp(room));
 if(view==="rooms")return drawRooms(V);
 if(view==="cal")return drawCal(V);
 if(view==="rev")return drawRev(V);
 if(view==="doc")return drawDocs(V);
 if(view==="staff")return drawStaff(V);
 drawAll(V)}
function progCard(){const dn=tasks.filter(t=>!open(t)).length,op=tasks.filter(open).length;
 return `<div class="prog2"><span>Guztira egindakoak: <b class="pd">${dn}</b></span></div>`}
function drawRooms(V){

function longDrag(handle,item,itemSel,container,onDrop){
 let timer=null,sx=0,sy=0,active=false,gx=0,gy=0;
 const pt=e=>e.touches?e.touches[0]:e;
 const natural=()=>{const t=item.style.transform;item.style.transform="";const r=item.getBoundingClientRect();item.style.transform=t;return r};
 const place=(x,y)=>{const r=natural();item.style.transform=`translate(${x-gx-r.left}px,${y-gy-r.top}px)`};
 const start=e=>{if(e.button>0)return;const p=pt(e);sx=p.clientX;sy=p.clientY;
  timer=setTimeout(()=>{active=true;const r=item.getBoundingClientRect();gx=sx-r.left;gy=sy-r.top;item.classList.add("lifting");document.body.classList.add("dragging");try{navigator.vibrate&&navigator.vibrate(15)}catch(x){}},450)};

  if(!active){if(timer&&Math.hypot(p.clientX-sx,p.clientY-sy)>10){clearTimeout(timer);timer=null}return}
  e.preventDefault();place(p.clientX,p.clientY);
  item.style.visibility="hidden";const under=document.elementFromPoint(p.clientX,p.clientY);item.style.visibility="";
  const tgt=under&&under.closest(itemSel);
  if(tgt&&tgt!==item&&tgt.parentElement===container){const items=[...container.querySelectorAll(":scope > "+itemSel)];
   if(items.indexOf(tgt)<items.indexOf(item))container.insertBefore(item,tgt);else container.insertBefore(item,tgt.nextSibling);place(p.clientX,p.clientY)}
  if(p.clientY<60)scrollBy(0,-10);else if(p.clientY>innerHeight-60)scrollBy(0,10)};

  item.style.transform="";item.classList.remove("lifting");document.body.classList.remove("dragging");
  onDrop([...container.querySelectorAll(":scope > "+itemSel)])};

function sortable(list,onDone){

  const row=h.closest("[data-k]");let start=e.clientY;const gap=6;row.classList.add("drag");try{h.setPointerCapture(e.pointerId)}catch(x){}
  const move=ev=>{let dy=ev.clientY-start;const prev=row.previousElementSibling,next=row.nextElementSibling;
   if(next&&dy>next.offsetHeight/2+gap){list.insertBefore(next,row);start+=next.offsetHeight+gap;dy=ev.clientY-start}
   else if(prev&&-dy>prev.offsetHeight/2+gap){list.insertBefore(row,prev);start-=prev.offsetHeight+gap;dy=ev.clientY-start}
   row.style.transform=`translateY(${dy}px)`;
   const sc=$("sheet"),r=sc.getBoundingClientRect();if(ev.clientY<r.top+50)sc.scrollTop-=8;else if(ev.clientY>r.bottom-50)sc.scrollTop+=8};
  const up=()=>{h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);

AS={async upload(file,o){if(file.size>15*1024*1024){const e=new Error("too_large");e.code="too_large";throw e}
  const id=newId(),type=(o&&o.type)||file.type||"application/octet-stream";await putBlob(id,{name:file.name||"",type,size:file.size},b64(await file.arrayBuffer()));
  BLOBS[id]=URL.createObjectURL(new Blob([file],{type}));return{id,contentType:type,sizeBytes:file.size}},
 async delete(id){const ref=FB.collection("files").doc(id),c=await ref.collection("c").get();for(const d of c.docs)await d.ref.delete();await ref.delete()}};
async function getBlob(id){const ref=FB.collection("files").doc(id),m=await ref.get();if(!m.exists)throw new Error("404");const {n,type}=m.data();let s="";
 for(let i=0;i<n;i++){const c=await ref.collection("c").doc(String(i)).get();s+=c.data().d}return new Blob([unb64(s)],{type})}
async function blobObj(id){if(!BLOBS[id])BLOBS[id]=URL.createObjectURL(await getBlob(id));return BLOBS[id]}
DL={async save({filename,data}){const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename||"fitxategia";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}};
/* miniaturak: <img data-blob> async bete */
new MutationObserver(()=>document.querySelectorAll("img[data-blob]:not([data-ok])").forEach(im=>{im.dataset.ok=1;blobObj(im.dataset.blob).then(u=>im.src=u).catch(()=>{})})).observe(document.documentElement,{childList:true,subtree:true});
/* sarrera-pantaila */
function gate(html){let g=$("gate");if(!g){g=document.createElement("div");g.id="gate";document.body.appendChild(g)}g.innerHTML=html;g.hidden=!html}
function login(){gate(`<div class="gbox"><img src="icon-192.png" alt="" width="96" height="96"><h2>Ikastolako Mantenua</h2><button class="btn pri" id="gIn">Sartu Google-rekin</button><p id="gMsg" class="gmsg"></p></div>`);
 $("gIn").onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{await firebase.auth().signInWithPopup(p)}catch(e){if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))return firebase.auth().signInWithRedirect(p);$("gMsg").textContent="Ezin izan da sartu ("+(e&&e.code||"errorea")+")"}}}
function denied(u){gate(`<div class="gbox"><h2>Ez duzu baimenik</h2><p class="gmsg">${esc(u.email||"")} kontuak ez du sarbiderik.</p><button class="btn" id="gOut">Beste kontu batekin sartu</button></div>`);$("gOut").onclick=()=>firebase.auth().signOut()}
let SUBS=[];
function start(){const err=e=>{if(e&&e.code==="permission-denied")denied(FBU);else toast("Ez dago konexiorik datuekin. Kargatu berriro orria.")};
 DB=FB;spaces=[];ALL=[];events=[];revs=[];docs=[];staff=[];render();
 const on=(c,f)=>SUBS.push(FB.collection(c).onSnapshot(f,err));
 on("spaces",s=>{spaces=s.docs.map(d=>({id:d.id,...cl(d.data())}));render();imp(s)});
 on("config",s=>{const d=s.docs.find(x=>x.id==="order");const z=d&&cl(d.data()).zones;if(Array.isArray(z)){ZU=z;render()}});
 on("staff",s=>{staff=s.docs.map(d=>({id:d.id,...cl(d.data())}));render()});
 on("docs",s=>{docs=s.docs.map(d=>({id:d.id,...cl(d.data())}));render();if(!$("ov").hidden&&window._docRefresh)window._docRefresh()});
 on("revs",s=>{revs=s.docs.map(d=>({id:d.id,...cl(d.data())}));render()});
 on("events",s=>{events=s.docs.map(d=>({id:d.id,...cl(d.data())}));render()});
 on("tasks",s=>{ALL=s.docs.map(d=>({id:d.id,...cl(d.data())}));render()})}
/* datuak inportatu (Claude-tik ekarritako kopia) eta kopia deskargatu */
function imp(s){const want=location.hash==="#inportatu"||(!s.metadata.fromCache&&s.empty);$("impBar").hidden=!want}
async function doImport(file){const st=$("impS");try{const o=JSON.parse(await file.text());if(o.app!=="mantenua"||!o.collections)throw new Error("format");
  const W=[];for(const[c,m]of Object.entries(o.collections))for(const[id,d]of Object.entries(m))W.push([c,id,d]);
  for(let i=0;i<W.length;i+=400){const b=FB.batch();W.slice(i,i+400).forEach(([c,id,d])=>b.set(FB.collection(c).doc(id),d));await b.commit();st.textContent=`Datuak: ${Math.min(i+400,W.length)}/${W.length}`}
  const F=Object.entries(o.files||{});let k=0;for(const[id,f]of F){st.textContent=`Fitxategiak: ${++k}/${F.length}`;await putBlob(id,{name:f.name||"",type:f.type||"application/pdf",size:f.size||0},f.b64)}
  st.textContent="✓ Dena inportatuta";if(location.hash)history.replaceState(null,"",location.pathname);setTimeout(()=>$("impBar").hidden=true,2500)}
 catch(e){st.textContent="Ezin izan da inportatu: "+(e&&(e.code||e.message)||e)}}
async function doExport(){const out={app:"mantenua",v:1,exported:today,collections:{},files:{}};
 for(const c of["spaces","tasks","events","revs","docs","staff","config"]){const s=await FB.collection(c).get();out.collections[c]={};s.docs.forEach(d=>out.collections[c][d.id]=d.data())}
 const fs=await FB.collection("files").get();for(const d of fs.docs){const b=await getBlob(d.id);out.files[d.id]={...d.data(),b64:b64(await b.arrayBuffer())};delete out.files[d.id].n}
 await DL.save({filename:"mantenua-kopia-"+today+".json",data:new Blob([JSON.stringify(out)],{type:"application/json"})})}
/* ---------- arranque ---------- */
render();
(async()=>{
 if(!window.FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){gate(`<div class="gbox"><h2>Konfigurazioa falta da</h2><p class="gmsg">Itsatsi Firebase-ren konfigurazioa <b>config.js</b> fitxategian.</p></div>`);return}
 try{for(const m of["app","auth","firestore"])await loadScript(FBB+"firebase-"+m+"-compat.js")}catch(e){gate(`<div class="gbox"><h2>Ezin da kargatu</h2><p class="gmsg">Egiaztatu Interneterako konexioa.</p></div>`);return}
 firebase.initializeApp(FIREBASE_CONFIG);FB=firebase.firestore();
 try{await FB.enablePersistence({synchronizeTabs:true})}catch(e){}
 $("impF").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)doImport(f)};$("impX").onclick=()=>$("impBar").hidden=true;
 $("fOut").onclick=()=>firebase.auth().signOut();$("fBk").onclick=async()=>{$("fBk").textContent="Prestatzen…";try{await doExport()}catch(e){toast("Ezin izan da kopia egin")}$("fBk").textContent="Kopia deskargatu"};
 firebase.auth().getRedirectResult().catch(()=>{});
 firebase.auth().onAuthStateChanged(u=>{FBU=u;SUBS.forEach(f=>f());SUBS=[];
  if(!u){DB=null;$("fUser").hidden=true;login();return}
  gate("");$("fUser").hidden=false;$("fMe").textContent=u.email||"";start()})})();
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
